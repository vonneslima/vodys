version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: Vodys-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - Vodys-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: Vodys-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - Vodys-net
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: Vodys-backend:${TAG:-latest}
    container_name: Vodys-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    networks:
      - Vodys-net
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    command: >
      sh -c "npx prisma migrate deploy && node dist/app.js"
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    image: Vodys-frontend:${TAG:-latest}
    container_name: Vodys-frontend
    restart: always
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    networks:
      - Vodys-net
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: Vodys-nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - backend_uploads:/var/www/uploads:ro
    networks:
      - Vodys-net

networks:
  Vodys-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_logs:
